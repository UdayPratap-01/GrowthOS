# Production-shaped stack for validation — NOT a turnkey cloud deploy.
#
# Usage:
#   1. Copy .env.example → .env.production and fill REAL secrets (never commit).
#   2. Ensure AUTONOMOUS_EXECUTION_ENABLED=false and CANARY_ENABLED=false unless
#      performing an explicit, allowlisted provider canary.
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Live ads remain OFF by default. M6/M7 real provider verification is separate.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growthos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-growthos}
    volumes:
      - growthos_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growthos} -d ${POSTGRES_DB:-growthos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Do not publish 5432 to the host in real production — use a private network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - growthos_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEMO_MODE: "false"
      DB_AUTO_CREATE: "false"
      INLINE_JOB_EXECUTION: "false"
      AUTONOMOUS_EXECUTION_ENABLED: "false"
      CANARY_ENABLED: "false"
      PROVIDER_VERIFICATION_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:?set DATABASE_URL_SYNC}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEMO_MODE: "false"
      DB_AUTO_CREATE: "false"
      INLINE_JOB_EXECUTION: "false"
      # Safety defaults — override only for an explicit canary, never casually.
      AUTONOMOUS_EXECUTION_ENABLED: ${AUTONOMOUS_EXECUTION_ENABLED:-false}
      CANARY_ENABLED: ${CANARY_ENABLED:-false}
      PROVIDER_VERIFICATION_ENABLED: ${PROVIDER_VERIFICATION_ENABLED:-false}
      AUTONOMOUS_KILL_SWITCH: ${AUTONOMOUS_KILL_SWITCH:-false}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEMO_MODE: "false"
      INLINE_JOB_EXECUTION: "false"
      AUTONOMOUS_EXECUTION_ENABLED: ${AUTONOMOUS_EXECUTION_ENABLED:-false}
      CANARY_ENABLED: ${CANARY_ENABLED:-false}
      PROVIDER_VERIFICATION_ENABLED: ${PROVIDER_VERIFICATION_ENABLED:-false}
      AUTONOMOUS_KILL_SWITCH: ${AUTONOMOUS_KILL_SWITCH:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  growthos_prod_pg_data:
  growthos_prod_redis_data:
